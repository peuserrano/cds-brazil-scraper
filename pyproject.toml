[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cds-brazil-scraper"
version = "0.1.0"
description = "Scraper de dados históricos de CDS do Brasil via Investing.com"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pedro Serrano", email = "pserranonascimento@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
